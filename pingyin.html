<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古詩拼音練習｜計時挑戰 · 50首</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== 鎖定頁面文字：禁止選取與拖曳 ===== */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* 輸入框允許選取與編輯 */
        input, textarea, select {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        /* 允許下拉選單點擊 */
        select {
            -webkit-user-select: auto;
            user-select: auto;
        }

        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', 'PingFang TC', 'KaiTi', serif;
            background: #f8f4e8;
            background-image: linear-gradient(145deg, #f2ebd9 0%, #e8dfcc 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 250, 240, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 40px -12px rgba(80, 60, 30, 0.35),
                        0 0 0 1px rgba(210, 180, 140, 0.5) inset;
            padding: 2.2rem 2rem 2.5rem;
            margin: 1rem 0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: 0.15rem;
            color: #3e2e1b;
            text-align: center;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        h1 span {
            font-size: 1.1rem;
            background: #d9c7a8;
            color: #2d241a;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            letter-spacing: 0.1rem;
            font-weight: 400;
            box-shadow: 0 2px 6px rgba(100, 70, 30, 0.15);
        }

        .subhead {
            text-align: center;
            color: #7a6a55;
            font-style: italic;
            margin-bottom: 1.5rem;
            font-size: 0.98rem;
            border-bottom: 1px dashed #ccb99e;
            padding-bottom: 1rem;
        }

        /* 下拉選擇列表 */
        .selector-bar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            background: #f0e8dc;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            box-shadow: inset 0 1px 4px rgba(120, 90, 50, 0.1);
            border: 1px solid #ddcfbc;
            flex-wrap: wrap;
        }

        .selector-bar label {
            font-size: 0.95rem;
            color: #5a4b38;
            font-weight: 500;
            white-space: nowrap;
        }

        .poem-select {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-family: inherit;
            background: #fffdf8;
            border: 1.5px solid #cbb89b;
            border-radius: 40px;
            color: #3e2e1b;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238e7b63' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            padding-right: 2.5rem;
            letter-spacing: 0.03rem;
        }

        .poem-select:hover {
            border-color: #ad9276;
            background-color: #fffefb;
        }

        .poem-select:focus {
            border-color: #a58d72;
            box-shadow: 0 0 0 4px rgba(180, 150, 110, 0.15);
        }

        .poem-count-badge {
            font-size: 0.8rem;
            color: #7a6a55;
            background: #e9ddcc;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            white-space: nowrap;
        }

        /* 計時設定列 */
        .timer-bar {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 1.5rem;
            background: #f0e8dc;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            box-shadow: inset 0 1px 4px rgba(120, 90, 50, 0.1);
            border: 1px solid #ddcfbc;
            flex-wrap: wrap;
        }

        .timer-bar label {
            font-size: 0.95rem;
            color: #5a4b38;
            font-weight: 500;
            white-space: nowrap;
        }

        .timer-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .timer-option {
            background: #fffdf8;
            border: 1.5px solid #cbb89b;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #5a4b38;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 500;
        }

        .timer-option:hover {
            background: #f5ede1;
            border-color: #ad9276;
        }

        .timer-option.active {
            background: #7c6a52;
            border-color: #5e4e3a;
            color: #fcf7ef;
            box-shadow: 0 3px 6px rgba(70, 50, 20, 0.25);
        }

        .timer-option:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* 拼音顯示/隱藏按鈕 */
        .toggle-pinyin-btn {
            margin-left: auto;
            background: transparent;
            border: 1px solid #d0bea8;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #6c5b46;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .toggle-pinyin-btn:hover {
            background: #e9ddcc;
            border-color: #b8a48c;
            color: #3e2e1b;
        }

        .toggle-pinyin-btn.active {
            background: #cdb79b;
            border-color: #b39b7c;
            color: #2d241a;
        }

        .toggle-pinyin-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .timer-display {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Segoe UI', 'Microsoft JhengHei', monospace;
            color: #3b2c1a;
            background: #fffdf8;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            border: 1.5px solid #cbb89b;
            letter-spacing: 0.05rem;
            min-width: 110px;
            text-align: center;
            transition: all 0.2s;
        }

        .timer-display.warning {
            color: #c0392b;
            border-color: #e6a5a5;
            background: #fdf2f2;
            animation: pulse 1s infinite;
        }

        .timer-display.running {
            border-color: #7c6a52;
            background: #f5ede1;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* 空白提示 */
        .empty-prompt {
            background: #fffdf8;
            border-radius: 2rem;
            padding: 3rem 2rem;
            text-align: center;
            color: #a18d77;
            font-size: 1.05rem;
            box-shadow: 0 10px 20px -8px rgba(80, 60, 30, 0.2),
                        0 0 0 1px #ede3d4 inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .empty-prompt .icon {
            font-size: 3rem;
            opacity: 0.7;
        }

        .empty-prompt .hint-text {
            font-style: italic;
        }

        /* 主內容區 */
        .practice-area {
            background: #fffdf8;
            border-radius: 2rem;
            padding: 1.8rem 1.6rem 1.6rem;
            box-shadow: 0 10px 20px -8px rgba(80, 60, 30, 0.2),
                        0 0 0 1px #ede3d4 inset;
            display: none;
        }

        .practice-area.visible {
            display: block;
        }

        .poem-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #3b2c1a;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            border-left: 6px solid #b39b7c;
            padding-left: 1rem;
            flex-wrap: wrap;
        }

        .poem-title small {
            font-size: 0.9rem;
            color: #8e7b63;
            font-weight: 400;
            margin-left: auto;
            font-style: italic;
        }

        /* 每一行區塊 */
        .line-block {
            background: #f6f0e4;
            border-radius: 1.2rem;
            padding: 0.8rem 1rem 0.9rem;
            margin-bottom: 1rem;
            border: 1px solid #ddcfbc;
            box-shadow: inset 0 1px 4px rgba(160, 130, 90, 0.08);
            transition: all 0.2s;
        }

        .line-block.active {
            border-color: #b39b7c;
            box-shadow: 0 0 0 3px rgba(180, 150, 110, 0.2), inset 0 1px 4px rgba(160, 130, 90, 0.08);
        }

        /* 上方顯示 */
        .line-display {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: center;
            gap: 0.2rem;
            margin-bottom: 0.5rem;
        }

        .char-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 2.2rem;
            flex: 0 0 auto;
        }

        .char-cell .hanzi {
            font-size: 1.6rem;
            font-weight: 500;
            color: #2a1f12;
            font-family: 'KaiTi', 'Noto Serif TC', 'Times New Roman', serif;
            line-height: 1.2;
            transition: color 0.15s;
        }

        .char-cell .pinyin {
            font-size: 0.95rem;
            color: #7e6b52;
            text-transform: lowercase;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #efe5d7;
            padding: 0.12rem 0.4rem;
            border-radius: 10px;
            white-space: nowrap;
            font-weight: 500;
            margin-top: 0.15rem;
            border: 1px solid #dfd1be;
            text-align: center;
            transition: all 0.15s;
        }

        .pinyin.hidden {
            display: none;
        }

        .char-cell.correct .hanzi {
            color: #1e7b3c;
        }
        .char-cell.correct .pinyin {
            background: #d4edda;
            border-color: #8fc99e;
            color: #1e5a2e;
        }

        .char-cell.wrong .hanzi {
            color: #c0392b;
        }
        .char-cell.wrong .pinyin {
            background: #f8d7da;
            border-color: #e6a5a5;
            color: #a12b2b;
        }

        .char-cell.pending .hanzi {
            color: #2a1f12;
        }

        .punctuation {
            font-size: 1.4rem;
            color: #7e6b52;
            margin-left: 0.1rem;
            margin-right: 0.2rem;
            align-self: flex-end;
            line-height: 2rem;
        }

        .line-input-wrapper {
            display: flex;
            justify-content: center;
        }

        .line-input {
            width: 100%;
            max-width: 100%;
            padding: 0.6rem 1rem;
            font-size: 1.3rem;
            font-family: 'KaiTi', 'Noto Serif TC', 'Microsoft JhengHei', monospace;
            background: #ffffff;
            border: 1.5px solid #d6c6b2;
            border-radius: 30px;
            outline: none;
            color: #2f2418;
            transition: all 0.15s;
            text-align: center;
            letter-spacing: 0.1rem;
            line-height: 1.5;
        }

        .line-input:focus {
            border-color: #a58d72;
            box-shadow: 0 0 0 3px rgba(180, 150, 110, 0.2);
            background: #fffefb;
        }

        .line-input::placeholder {
            color: #cfc1ad;
            font-size: 0.85rem;
            letter-spacing: 0.02rem;
            font-style: italic;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        }

        .line-input:disabled {
            background: #f0ebe3;
            color: #8c7a63;
            cursor: not-allowed;
        }

        .input-hint {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #8c7a63;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .btn-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .clear-btn, .submit-btn {
            background: transparent;
            border: 1px solid #d0bea8;
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #6c5b46;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .clear-btn:hover {
            background: #e9ddcc;
            border-color: #b8a48c;
            color: #3e2e1b;
        }

        .submit-btn {
            background: #7c6a52;
            border-color: #5e4e3a;
            color: #fcf7ef;
        }

        .submit-btn:hover {
            background: #6a5a44;
            border-color: #4a3d2c;
        }

        .submit-btn:disabled, .clear-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .keyboard-tip {
            background: #e9e0d2;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #5a4b38;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .keyboard-tip kbd {
            background: #fff7ec;
            border-radius: 8px;
            padding: 0.1rem 0.5rem;
            font-weight: 600;
            border: 1px solid #bfae98;
            font-size: 0.75rem;
            box-shadow: 0 1px 0 #bfae98;
            color: #3a2d1d;
            font-family: monospace;
        }

        /* 結果面板 */
        .result-panel {
            margin-top: 1.8rem;
            background: #f9f4ea;
            border-radius: 1.5rem;
            padding: 1.5rem 1.4rem;
            border: 1px solid #ddcfbc;
            box-shadow: 0 8px 16px -6px rgba(100, 70, 30, 0.15);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .result-panel.visible {
            display: block;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #3b2c1a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .result-score {
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            background: #e9ddcc;
            color: #3e2e1b;
        }

        .result-score.perfect {
            background: #d4edda;
            color: #1e7b3c;
        }
        .result-score.good {
            background: #fff3cd;
            color: #856404;
        }
        .result-score.poor {
            background: #f8d7da;
            color: #a12b2b;
        }

        .score-summary {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .score-card {
            flex: 1;
            min-width: 100px;
            background: #fffdf8;
            border-radius: 12px;
            padding: 0.6rem 0.8rem;
            border: 1px solid #e2d5c5;
            text-align: center;
        }

        .score-card .sc-label {
            font-size: 0.75rem;
            color: #8c7a63;
            margin-bottom: 0.2rem;
        }

        .score-card .sc-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #3b2c1a;
        }

        .score-card .sc-value.highlight {
            color: #1e7b3c;
        }

        .result-poem-lines {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .result-line {
            background: #fffdf8;
            border-radius: 12px;
            padding: 0.6rem 1rem 0.7rem;
            border: 1px solid #e2d5c5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .result-line .rline-chars {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.15rem;
            align-items: flex-end;
        }

        .result-line .rchar {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 2.1rem;
        }

        .result-line .rchar .r-target {
            font-size: 1.45rem;
            font-weight: 600;
            font-family: 'KaiTi', 'Noto Serif TC', serif;
            line-height: 1.2;
        }

        .result-line .rchar .r-input {
            font-size: 1rem;
            font-weight: 500;
            font-family: 'KaiTi', 'Noto Serif TC', serif;
            margin-top: 0.1rem;
            min-height: 1.2rem;
        }

        .result-line .rchar.correct .r-target {
            color: #1e7b3c;
        }
        .result-line .rchar.correct .r-input {
            color: #1e7b3c;
        }
        .result-line .rchar.wrong .r-target {
            color: #c0392b;
        }
        .result-line .rchar.wrong .r-input {
            color: #c0392b;
        }
        .result-line .rchar.pending .r-target {
            color: #3b2c1a;
        }
        .result-line .rchar.pending .r-input {
            color: #a18d77;
        }

        .result-line .rchar .r-icon {
            font-size: 0.65rem;
            margin-top: 0.05rem;
        }

        .result-line .rchar.correct .r-icon {
            color: #1e7b3c;
        }
        .result-line .rchar.wrong .r-icon {
            color: #c0392b;
        }

        .result-line .result-punctuation {
            font-size: 1.2rem;
            color: #7e6b52;
            margin-left: 0.1rem;
            align-self: flex-end;
            margin-bottom: 0.2rem;
        }

        .result-legend {
            font-size: 0.8rem;
            color: #8c7a63;
            text-align: center;
        }

        .history-section {
            margin-top: 1.8rem;
            background: #faf6ee;
            border-radius: 1.5rem;
            padding: 1.2rem 1.4rem;
            border: 1px solid #e2d5c5;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.9rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .history-title {
            font-size: 1rem;
            font-weight: 600;
            color: #4d3a24;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .clear-history-btn {
            background: transparent;
            border: 1px solid #d0bea8;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            font-size: 0.78rem;
            color: #7a6a55;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .clear-history-btn:hover {
            background: #f0e8dc;
            border-color: #b8a48c;
            color: #3e2e1b;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }

        .history-list::-webkit-scrollbar {
            width: 5px;
        }
        .history-list::-webkit-scrollbar-track {
            background: #ede3d4;
            border-radius: 10px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #c2ad93;
            border-radius: 10px;
        }

        .history-entry {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: #fffdf8;
            border-radius: 12px;
            padding: 0.6rem 1rem;
            border: 1px solid #ede3d4;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .history-entry .he-title {
            font-weight: 600;
            color: #3b2c1a;
            min-width: 100px;
        }

        .history-entry .he-score {
            padding: 0.1rem 0.7rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .he-score.perfect {
            background: #d4edda;
            color: #1e7b3c;
        }
        .he-score.good {
            background: #fff3cd;
            color: #856404;
        }
        .he-score.poor {
            background: #f8d7da;
            color: #a12b2b;
        }

        .history-entry .he-detail {
            font-size: 0.75rem;
            color: #8c7a63;
        }

        .history-entry .he-time {
            color: #a18d77;
            font-size: 0.75rem;
            margin-left: auto;
        }

        .empty-history {
            color: #a18d77;
            font-size: 0.85rem;
            font-style: italic;
            text-align: center;
            padding: 0.8rem 0;
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #a18d77;
            letter-spacing: 0.03rem;
            border-top: 1px solid #e2d5c5;
            padding-top: 1.2rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.2rem 0.8rem;
            }

            h1 {
                font-size: 1.7rem;
            }

            .char-cell {
                min-width: 1.9rem;
            }

    // ---------- 狀態管理 ----------
    let currentPoemId = '';
    let currentLines = [];
    let lineCorrectMaps = [];
    let pinyinVisible = true;

    let selectedMinutes = 0;
    let timerInterval = null;
    let remainingSeconds = 0;
    let totalSeconds = 0;
    let timerRunning = false;
    let timerFinished = false;
    let timerStarted = false;

    const HISTORY_KEY = 'poem_practice_history_v15';
    let history = [];

    const poemSelect = document.getElementById('poemSelect');
    const poemTitle = document.getElementById('poemTitle');
    const linesContainer = document.getElementById('linesContainer');
    const emptyPrompt = document.getElementById('emptyPrompt');
    const practiceArea = document.getElementById('practiceArea');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.getElementById('submitBtn');
    const togglePinyinBtn = document.getElementById('togglePinyinBtn');
    const poemCountBadge = document.getElementById('poemCountBadge');
    const resultPanel = document.getElementById('resultPanel');
    const resultScore = document.getElementById('resultScore');
    const scoreSummary = document.getElementById('scoreSummary');
    const resultPoemLines = document.getElementById('resultPoemLines');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    const timerOptions = document.getElementById('timerOptions');
    const timerDisplay = document.getElementById('timerDisplay');

    function showToast(message, isSuccess = false) {
        const existing = document.querySelector('.toast-message');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-message' + (isSuccess ? ' success' : '');
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    function isCJKChar(ch) {
        if (!ch) return false;
        const code = ch.codePointAt(0);
        return (code >= 0x4E00 && code <= 0x9FFF) ||
               (code >= 0x3400 && code <= 0x4DBF) ||
               (code >= 0xF900 && code <= 0xFAFF);
    }

    function isPunctuation(ch) {
        const punctuationChars = '，。！？、；：,.!?;:';
        return punctuationChars.includes(ch);
    }

    function extractHanzi(text) {
        const result = [];
        for (const ch of text) {
            if (isCJKChar(ch)) result.push(ch);
        }
        return result;
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerDisplay() {
        if (timerRunning || timerFinished) {
            timerDisplay.textContent = formatTime(remainingSeconds);
            if (remainingSeconds <= 30 && timerRunning) {
                timerDisplay.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
            }
            if (timerRunning) {
                timerDisplay.classList.add('running');
            } else {
                timerDisplay.classList.remove('running');
            }
        } else if (selectedMinutes > 0) {
            timerDisplay.textContent = formatTime(selectedMinutes * 60);
            timerDisplay.classList.remove('warning', 'running');
        } else {
            timerDisplay.textContent = '--:--';
            timerDisplay.classList.remove('warning', 'running');
        }
    }

    function updateInputAvailability() {
        const canInput = currentPoemId && selectedMinutes > 0 && !timerFinished;
        const inputs = linesContainer.querySelectorAll('.line-input');
        inputs.forEach(inp => { inp.disabled = !canInput; });

        clearBtn.disabled = !canInput;
        togglePinyinBtn.disabled = !currentPoemId;

        if (currentPoemId && selectedMinutes > 0) {
            submitBtn.disabled = false;
        } else {
            submitBtn.disabled = true;
        }
    }

    function shouldStartTimer() {
        return currentPoemId && selectedMinutes > 0 && !timerRunning && !timerFinished && !timerStarted;
    }

    function selectTimer(minutes) {
        if (timerRunning) return;

        const hadInput = Array.from(linesContainer.querySelectorAll('.line-input')).some(inp => inp.value.trim() !== '');
        const isRestart = timerFinished || timerStarted || hadInput;

        if (timerFinished) {
            timerFinished = false;
            timerStarted = false;
        }

        if (isRestart) {
            clearAllInputs();
        }

        selectedMinutes = minutes;
        timerOptions.querySelectorAll('.timer-option').forEach(btn => {
            if (parseInt(btn.dataset.minutes) === minutes) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        totalSeconds = minutes * 60;
        remainingSeconds = totalSeconds;
        updateTimerDisplay();
        updateInputAvailability();
    }

    function startTimer() {
        if (timerRunning || timerFinished) return;
        if (!currentPoemId || selectedMinutes <= 0) return;

        timerRunning = true;
        timerStarted = true;
        timerFinished = false;
        remainingSeconds = totalSeconds;
        updateTimerDisplay();
        setTimerOptionsDisabled(true);
        updateInputAvailability();

        timerInterval = setInterval(() => {
            remainingSeconds--;
            updateTimerDisplay();

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                timerRunning = false;
                timerFinished = true;
                updateTimerDisplay();
                setTimerOptionsDisabled(false);
                updateInputAvailability();
                showToast('⏰ 時間到！輸入已停止，您可以送出結果了。', true);
            }
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timerRunning = false;
        timerFinished = false;
        timerStarted = false;
        setTimerOptionsDisabled(false);
        if (selectedMinutes > 0) {
            remainingSeconds = totalSeconds;
            updateTimerDisplay();
        } else {
            timerDisplay.textContent = '--:--';
        }
        updateInputAvailability();
    }

    function setTimerOptionsDisabled(disabled) {
        timerOptions.querySelectorAll('.timer-option').forEach(btn => {
            btn.disabled = disabled;
        });
        if (!disabled && selectedMinutes > 0) {
            timerOptions.querySelectorAll('.timer-option').forEach(btn => {
                if (parseInt(btn.dataset.minutes) === selectedMinutes) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
    }

    function getLineTargetLength(lineIdx) {
        return currentLines[lineIdx] ? currentLines[lineIdx].text.length : 0;
    }

    function getLinePunctuation(lineIdx, totalLines) {
        if (lineIdx === totalLines - 1) return '。';
        return lineIdx % 2 === 0 ? '，' : '。';
    }

    function normalizeInputValue(value, targetLength) {
        const hanzi = extractHanzi(value);
        const truncatedHanzi = hanzi.slice(0, targetLength).join('');

        let trailingPunc = '';
        const trimmed = value.trim();
        if (trimmed.length > 0) {
            const lastChar = trimmed[trimmed.length - 1];
            if (isPunctuation(lastChar) && hanzi.length <= targetLength) {
                trailingPunc = lastChar;
            }
        }
        return truncatedHanzi + trailingPunc;
    }

    function updateLineColors(lineIdx) {
        const block = linesContainer.querySelector(`.line-block[data-line="${lineIdx}"]`);
        if (!block) return;
        const displayCells = block.querySelectorAll('.line-display .char-cell');
        const inputEl = block.querySelector('.line-input');
        const targetText = block.dataset.target;
        const inputHanzi = extractHanzi(inputEl.value);

        lineCorrectMaps[lineIdx] = [];
        displayCells.forEach((cell, idx) => {
            const targetChar = targetText[idx] || '';
            const inputChar = inputHanzi[idx] || null;
            cell.classList.remove('correct', 'wrong', 'pending');
            if (inputChar === null) {
                cell.classList.add('pending');
                lineCorrectMaps[lineIdx][idx] = null;
            } else if (inputChar === targetChar) {
                cell.classList.add('correct');
                lineCorrectMaps[lineIdx][idx] = true;
            } else {
                cell.classList.add('wrong');
                lineCorrectMaps[lineIdx][idx] = false;
            }
        });
    }

    function updateLineHighlight() {
        const blocks = linesContainer.querySelectorAll('.line-block');
        const activeEl = document.activeElement;
        blocks.forEach(block => {
            if (block.contains(activeEl)) {
                block.classList.add('active');
            } else {
                block.classList.remove('active');
            }
        });
    }

    function focusNextLine(currentLineIdx) {
        const blocks = linesContainer.querySelectorAll('.line-block');
        const nextIdx = currentLineIdx + 1;
        if (nextIdx < blocks.length) {
            const nextInput = blocks[nextIdx].querySelector('.line-input');
            if (nextInput && !nextInput.disabled) {
                nextInput.focus();
                blocks[nextIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    }

    function renderPoem(poemId) {
        stopTimer();

        if (!poemId) {
            practiceArea.classList.remove('visible');
            emptyPrompt.style.display = 'flex';
            currentPoemId = '';
            currentLines = [];
            lineCorrectMaps = [];
            poemTitle.innerHTML = '';
            linesContainer.innerHTML = '';
            resultPanel.classList.remove('visible');
            updateInputAvailability();
            return;
        }

        const poem = poems.find(p => p.id === poemId);
        if (!poem) return;

        currentPoemId = poem.id;
        currentLines = poem.lines;
        emptyPrompt.style.display = 'none';
        practiceArea.classList.add('visible');

        poemTitle.innerHTML = `${poem.title} <small>${poem.author}</small>`;

        lineCorrectMaps = poem.lines.map(line => new Array(line.text.length).fill(null));

        let html = '';
        poem.lines.forEach((line, lineIdx) => {
            const text = line.text;
            const pinyinStr = line.pinyin;
            const pinyinArr = pinyinStr.split(/\s+/);
            const len = Math.min(text.length, pinyinArr.length);

            let charsHtml = '';
            for (let i = 0; i < len; i++) {
                const hanzi = text[i];
                const pinyin = pinyinArr[i] || '';
                charsHtml += `
                    <div class="char-cell pending">
                        <span class="hanzi">${hanzi}</span>
                        <span class="pinyin ${pinyinVisible ? '' : 'hidden'}">${pinyin}</span>
                    </div>
                `;
            }

            const punctuation = getLinePunctuation(lineIdx, poem.lines.length);
            charsHtml += `<span class="punctuation">${punctuation}</span>`;

            const maxCharsAttr = text.length + 10;

            html += `
                <div class="line-block" data-line="${lineIdx}" data-target="${text}">
                    <div class="line-display">${charsHtml}</div>
                    <div class="line-input-wrapper">
                        <input type="text" class="line-input" 
                               placeholder="請輸入整行文字…" 
                               autocomplete="off" spellcheck="false"
                               data-line="${lineIdx}" 
                               maxlength="${maxCharsAttr}" />
                    </div>
                </div>
            `;
        });
        linesContainer.innerHTML = html;

        bindInputEvents();
        resultPanel.classList.remove('visible');

        updateInputAvailability();
    }

    function bindInputEvents() {
        const inputs = linesContainer.querySelectorAll('.line-input');
        inputs.forEach(input => {
            const lineIdx = parseInt(input.dataset.line);
            let isComposing = false;

            input.addEventListener('compositionstart', () => {
                isComposing = true;
            });

            input.addEventListener('compositionend', () => {
                isComposing = false;
                const targetLength = getLineTargetLength(lineIdx);
                const normalized = normalizeInputValue(input.value, targetLength);
                if (input.value !== normalized) {
                    input.value = normalized;
                }
                updateLineColors(lineIdx);
                if (shouldStartTimer()) {
                    startTimer();
                }
            });

            input.addEventListener('input', () => {
                if (timerFinished) {
                    input.value = '';
                    return;
                }
                if (!currentPoemId || !selectedMinutes) return;
                if (isComposing) return;

                const targetLength = getLineTargetLength(lineIdx);
                const normalized = normalizeInputValue(input.value, targetLength);
                if (input.value !== normalized) {
                    input.value = normalized;
                }

                updateLineColors(lineIdx);
                resultPanel.classList.remove('visible');

                if (shouldStartTimer()) {
                    startTimer();
                }
            });

            input.addEventListener('focus', (e) => {
                if (!currentPoemId) {
                    e.target.blur();
                    showToast('請先選擇一首古詩！');
                    return;
                }
                if (!selectedMinutes) {
                    e.target.blur();
                    showToast('請先選擇計時時間！');
                    return;
                }
                if (timerFinished) {
                    e.target.blur();
                    showToast('時間已結束，無法再輸入。請點擊「送出結果」。');
                    return;
                }
                updateLineHighlight();
                input.closest('.line-block')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                if (shouldStartTimer()) {
                    startTimer();
                }
            });

            input.addEventListener('click', (e) => {
                if (!currentPoemId) {
                    e.target.blur();
                    showToast('請先選擇一首古詩！');
                    return;
                }
                if (!selectedMinutes) {
                    e.target.blur();
                    showToast('請先選擇計時時間！');
                    return;
                }
                if (timerFinished) {
                    e.target.blur();
                    showToast('時間已結束，無法再輸入。請點擊「送出結果」。');
                    return;
                }
                if (shouldStartTimer()) {
                    startTimer();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!timerFinished) {
                        focusNextLine(lineIdx);
                    }
                }
            });

            input.addEventListener('paste', (e) => {
                if (timerFinished) {
                    e.preventDefault();
                    return;
                }
                if (!currentPoemId || !selectedMinutes) {
                    e.preventDefault();
                    if (!currentPoemId) {
                        showToast('請先選擇一首古詩！');
                    } else if (!selectedMinutes) {
                        showToast('請先選擇計時時間！');
                    }
                    return;
                }
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                const targetLength = getLineTargetLength(lineIdx);
                const start = input.selectionStart;
                const end = input.selectionEnd;
                const before = input.value.slice(0, start);
                const after = input.value.slice(end);
                const merged = before + pasteData + after;
                input.value = normalizeInputValue(merged, targetLength);
                updateLineColors(lineIdx);
                if (shouldStartTimer()) {
                    startTimer();
                }
            });
        });
    }

    function clearAllInputs() {
        const inputs = linesContainer.querySelectorAll('.line-input');
        inputs.forEach(inp => { inp.value = ''; });
        currentLines.forEach((_, lineIdx) => {
            lineCorrectMaps[lineIdx] = new Array(currentLines[lineIdx].text.length).fill(null);
            updateLineColors(lineIdx);
        });
        resultPanel.classList.remove('visible');
    }

    function clearAll() {
        if (!currentPoemId) return;
        if (timerRunning) {
            if (!confirm('計時正在進行中，清空會中斷計時，確定嗎？')) return;
            stopTimer();
        }
        clearAllInputs();
        if (!timerFinished) {
            const firstInput = linesContainer.querySelector('.line-input');
            if (firstInput && !firstInput.disabled) firstInput.focus();
        }
    }

    function submitResult() {
        if (!currentPoemId) {
            showToast('請先選擇一首古詩');
            return;
        }
        if (!selectedMinutes) {
            showToast('請先選擇計時時間');
            return;
        }
        const poem = poems.find(p => p.id === currentPoemId);
        if (!poem) return;

        if (timerRunning) {
            clearInterval(timerInterval);
            timerInterval = null;
            timerRunning = false;
            setTimerOptionsDisabled(false);
            updateInputAvailability();
        }

        let correctTotal = 0;
        let totalChars = 0;

        let linesHtml = '';
        poem.lines.forEach((line, lineIdx) => {
            const block = linesContainer.querySelector(`.line-block[data-line="${lineIdx}"]`);
            if (!block) return;
            const inputEl = block.querySelector('.line-input');
            const inputHanzi = extractHanzi(inputEl.value);
            const targetText = line.text;
            totalChars += targetText.length;

            let charsHtml = '';
            for (let i = 0; i < targetText.length; i++) {
                const targetChar = targetText[i];
                const inputChar = inputHanzi[i] || null;
                let status, statusIcon;
                if (inputChar === null) {
                    status = 'pending';
                    statusIcon = '○';
                } else if (inputChar === targetChar) {
                    status = 'correct';
                    statusIcon = '✓';
                    correctTotal++;
                } else {
                    status = 'wrong';
                    statusIcon = '✗';
                }
                const inputDisplay = inputChar ? inputChar : '＿';
                charsHtml += `
                    <div class="rchar ${status}">
                        <span class="r-target">${targetChar}</span>
                        <span class="r-input">${inputDisplay}</span>
                        <span class="r-icon">${statusIcon}</span>
                    </div>
                `;
            }

            const punctuation = getLinePunctuation(lineIdx, poem.lines.length);
            charsHtml += `<span class="result-punctuation">${punctuation}</span>`;

            linesHtml += `
                <div class="result-line">
                    <div class="rline-chars">${charsHtml}</div>
                </div>
            `;
        });

        const correctRate = totalChars > 0 ? correctTotal / totalChars : 0;
        let baseScore = correctTotal * 10;
        let timeBonus = 0;

        if (!timerFinished && timerStarted && remainingSeconds > 0 && correctTotal > 0) {
            const maxBonus = Math.floor(baseScore * 0.5);
            timeBonus = Math.min(remainingSeconds, maxBonus);
        }

        let finalScore = baseScore + timeBonus;
        if (correctRate < 0.6 && totalChars > 0) {
            finalScore = Math.round(finalScore * 0.8);
        }

        resultPanel.classList.add('visible');

        const scoreText = `${correctTotal} / ${totalChars}`;
        resultScore.textContent = scoreText;
        resultScore.classList.remove('perfect', 'good', 'poor');
        const pct = totalChars > 0 ? correctTotal / totalChars : 0;
        if (pct === 1) {
            resultScore.classList.add('perfect');
        } else if (pct >= 0.6) {
            resultScore.classList.add('good');
        } else {
            resultScore.classList.add('poor');
        }

        let timeUsedStr = '--';
        if (timerFinished) {
            timeUsedStr = formatTime(totalSeconds);
        } else if (timerStarted) {
            timeUsedStr = formatTime(totalSeconds - remainingSeconds);
        } else {
            timeUsedStr = '00:00';
        }

        scoreSummary.innerHTML = `
            <div class="score-card">
                <div class="sc-label">⏱️ 用時</div>
                <div class="sc-value">${timeUsedStr}</div>
            </div>
            <div class="score-card">
                <div class="sc-label">✅ 正確字數</div>
                <div class="sc-value highlight">${correctTotal}</div>
            </div>
            <div class="score-card">
                <div class="sc-label">📝 總字數</div>
                <div class="sc-value">${totalChars}</div>
            </div>
            <div class="score-card">
                <div class="sc-label">🏆 總分</div>
                <div class="sc-value highlight">${finalScore}</div>
            </div>
        `;

        resultPoemLines.innerHTML = linesHtml;

        const record = {
            poemId: poem.id,
            poemTitle: poem.title,
            author: poem.author,
            correct: correctTotal,
            total: totalChars,
            score: finalScore,
            timeUsed: timerStarted ? totalSeconds - remainingSeconds : 0,
            totalTime: totalSeconds,
            timestamp: Date.now()
        };
        history.unshift(record);
        if (history.length > 50) history = history.slice(0, 50);
        saveHistory();
        renderHistory();

        timerFinished = true;
        updateInputAvailability();

        setTimeout(() => {
            resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
    }

    function loadHistory() {
        try {
            const raw = localStorage.getItem(HISTORY_KEY);
            if (raw) {
                history = JSON.parse(raw);
                if (!Array.isArray(history)) history = [];
            }
        } catch (e) { history = []; }
    }

    function saveHistory() {
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
    }

    function renderHistory() {
        if (!history.length) {
            historyList.innerHTML = '<div class="empty-history">尚無練習記錄</div>';
            return;
        }
        let html = '';
        history.forEach((rec) => {
            const pct = rec.total > 0 ? rec.correct / rec.total : 0;
            let scoreClass = 'poor';
            if (pct === 1) scoreClass = 'perfect';
            else if (pct >= 0.6) scoreClass = 'good';

            const date = new Date(rec.timestamp);
            const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;

            html += `
                <div class="history-entry">
                    <span class="he-title">${rec.poemTitle} · ${rec.author}</span>
                    <span class="he-score ${scoreClass}">${rec.correct} / ${rec.total}</span>
                    <span class="he-detail">得分 ${rec.score || '-'}</span>
                    <span class="he-time">${timeStr}</span>
                </div>
            `;
        });
        historyList.innerHTML = html;
    }

    function clearHistory() {
        if (history.length === 0) return;
        if (confirm('確定要清除所有練習記錄嗎？')) {
            history = [];
            saveHistory();
            renderHistory();
        }
    }

    function togglePinyin() {
        pinyinVisible = !pinyinVisible;
        document.querySelectorAll('.pinyin').forEach(el => {
            if (pinyinVisible) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        });
        if (pinyinVisible) {
            togglePinyinBtn.classList.add('active');
            togglePinyinBtn.textContent = '🔤 隱藏拼音';
        } else {
            togglePinyinBtn.classList.remove('active');
            togglePinyinBtn.textContent = '🔤 顯示拼音';
        }
    }

    poemSelect.addEventListener('change', (e) => {
        renderPoem(e.target.value);
        updateInputAvailability();
    });

    timerOptions.addEventListener('click', (e) => {
        const btn = e.target.closest('.timer-option');
        if (!btn || btn.disabled) return;
        const minutes = parseInt(btn.dataset.minutes);
        selectTimer(minutes);
        updateInputAvailability();
    });

    clearBtn.addEventListener('click', clearAll);
    submitBtn.addEventListener('click', submitResult);
    togglePinyinBtn.addEventListener('click', togglePinyin);
    clearHistoryBtn.addEventListener('click', clearHistory);

    function init() {
        poemSelect.innerHTML = '<option value="">請選擇一首古詩…</option>';
        poems.forEach((poem, index) => {
            const option = document.createElement('option');
            option.value = poem.id;
            option.textContent = `${index + 1}. ${poem.title} · ${poem.author}`;
            poemSelect.appendChild(option);
        });
        poemCountBadge.textContent = `共 ${poems.length} 首`;

        loadHistory();
        renderHistory();

        timerDisplay.textContent = '--:--';

        renderPoem('');
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
